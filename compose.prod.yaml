services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
      - pb_migrations:/pb/pb_migrations

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      - PUBLIC_POCKETBASE_URL=$PUBLIC_POCKETBASE_URL
      - POCKETBASE_URL=$POCKETBASE_URL

volumes:
  pb_data:
  pb_migrations:
